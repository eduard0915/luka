services:
  db-luka:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=luka_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  web-luka:
    build:
      context: .
      args:
        - SECRET_KEY=django-insecure-local-key
        - DATABASE_URL=postgres://postgres:postgres@db:5432/luka_db
        - MEDIA_URL=/media/
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - SECRET_KEY=django-insecure-local-key
      - DATABASE_URL=postgres://postgres:postgres@db:5432/luka_db
      - DEBUG=True
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
  static_volume:
  media_volume:
