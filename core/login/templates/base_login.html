{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <link rel="apple-touch-icon" sizes="76x76" href="{% static 'lib/vali-admin/img/favicon.png' %}">
    <link rel="icon" type="image/png" href="{% static 'lib/vali-admin/img/favicon.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'lib/vali-admin/img/favicon.png' %}"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="{% static 'lib/vali-admin/css/main.css' %}">
    <style>{% block styles %}{% endblock %}</style>
    <link rel="stylesheet" type="text/css"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
{% block body %}
<section class="material-half-bg">
    <div class="cover"></div>
</section>
<section class="login-content">
    <div class="logo text-center">
        <img src="{% static 'lib/vali-admin/img/padlims_white.png' %}" alt="PadLims" width="40%">
    </div>
    <div class="login-box" style="border-radius: 10px;">
        {% block content %}{% endblock %}
    </div>
</section>
{% endblock %}
<script src="{% static 'lib/vali-admin/js/jquery-3.7.0.min.js' %}"></script>
<script src="{% static 'lib/vali-admin/js/bootstrap.min.js' %}"></script>
<script src="{% static 'lib/vali-admin/js/main.js' %}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
