<div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">Procedimiento: {{ object.description_analytical_method }}</h5>
            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 100px;">Paso N°</th>
                            <th>Procedimiento</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in procedures %}
                            <tr>
                                <td class="text-center fw-bold">{{ item.step_procedure }}</td>
                                <td style="white-space: pre-wrap;">{{ item.procedure }}</td>
                            </tr>
                        {% empty %}
                            <tr>
                                <td colspan="2" class="text-center text-muted">No hay procedimientos registrados</td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cerrar</button>
        </div>
    </div>
</div>
