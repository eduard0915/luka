<div class="modal-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">{{ entity }}</h5>
            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"><span
                    aria-hidden="true"></span></button>
        </div>
        <form enctype="multipart/form-data" method="post" action="{{ action_url }}" class="form-horizontal"
              id="modal_form">
            <div class="modal-body">
                {% csrf_token %}
                <input type="hidden" value="discard" name="action">
                <div class="row">
                    <h5>¿Está seguro de desechar el remanente de la solución?</h5>
                    <p>{{ object.code_solution }} - {{ object.solute_reagent.reagent.description_reagent }}</p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-danger" id="btnDiscard">Si, Desechar</button>
                <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </form>
    </div>

    <script type="application/javascript">
        $('form').on('submit', function (e) {
            e.preventDefault();
            var parameters = new FormData(this);
            const form_action = $(this).attr('action');
            $.ajax({
                url: form_action,
                type: 'POST',
                data: parameters,
                dataType: 'json',
                processData: false,
                contentType: false,
            }).done(function (data) {
                if (!data.hasOwnProperty('error')) {
                    location.href = window.location.pathname;
                    return false;
                }
                message_error(data.error);
            }).fail(function (jqXHR, textStatus, errorThrown) {
                alert(textStatus + ': ' + errorThrown);
            });
        });

        $("#btnDiscard").click(function () {
            $(this).prop("disabled", true);
            $(this).submit()
            $(this).html(
                `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Desechando...`
            );
        });
    </script>
</div>
