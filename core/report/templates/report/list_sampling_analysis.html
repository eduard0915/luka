{% extends 'list_one.html' %}
{% load static %}

{% block scripts_detail %}
    {{ block.super }}
    <script src="{% static 'list_sampling_analysis.js' %}"></script>
{% endblock %}

{% block content %}
    <div class="row mb-3">
        <div class="col-md-3">
            <label>Producto</label>
            <select class="form-control select2" name="product" id="id_product">
                <option value="">---------</option>
                {% for p in products %}
                    <option value="{{ p.id }}">{{ p.description_product }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <label>Método Analítico</label>
            <select class="form-control select2" name="analytical_method" id="id_analytical_method">
                <option value="">---------</option>
            </select>
        </div>
        <div class="col-md-2">
            <label>Fecha Inicio</label>
            <input type="date" class="form-control" name="start_date" id="id_start_date">
        </div>
        <div class="col-md-2">
            <label>Fecha Final</label>
            <input type="date" class="form-control" name="end_date" id="id_end_date">
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button type="button" class="btn btn-success btn-flat btnExportExcel">
                <i class="fa-solid fa-file-excel"></i> Descargar Excel
            </button>
        </div>
    </div>

    {{ block.super }}
{% endblock %}

{% block columns %}
    <th>Fecha y Hora</th>
{% endblock %}

{% block rows %}
{% endblock %}
