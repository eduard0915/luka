{% extends 'body.html' %}
{% load static %}

{% block head %}
    <script src="{% static 'lib/vali-admin/js/plugins/chart.js' %}"></script>
{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-md-12">
            <div class="tile">
                <div class="tile-body">
                    <canvas id="myLineChart" style="width: 100%; height: 400px;"></canvas>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts_detail %}
    <script type="text/javascript">
        $(function () {
                function get_graph_data() {
                    $.ajax({
                        url: window.location.pathname,
                        type: 'POST',
                        data: {
                            'action': 'get_graph_data'
                        },
                        dataType: 'json',
                    }).done(function (data) {
                            if (!data.hasOwnProperty('error')) {
                                const ctx = document.getElementById('myLineChart').getContext('2d');
                                new Chart(ctx, {
                                    type: 'line',
                                    data: {
                                        labels: data.categories,
                                        datasets: [
                                            {
                                                label: 'Error (' + data.unit_tolerance + ')',
                                                data: data.series[0].data,
                                                borderColor: 'rgb(75, 192, 192)',
                                                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                                                pointRadius: 5,
                                                pointHoverRadius: 7,
                                                tension: 0.1,
                                                fill: false
                                            },
                                            {
                                                label: 'Tolerancia (' + data.unit_tolerance + ')',
                                                data: data.series[1].data,
                                                borderColor: 'rgb(255, 99, 132)',
                                                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                                                borderDash: [5, 5],
                                                pointRadius: 0,
                                                tension: 0.1,
                                                fill: false
                                            },
                                            {
                                                label: 'Tolerancia (-' + data.unit_tolerance + ')',
                                                data: data.series[2].data,
                                                borderColor: 'rgb(255, 99, 132)',
                                                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                                                borderDash: [5, 5],
                                                pointRadius: 0,
                                                tension: 0.1,
                                                fill: false
                                            }
                                        ]
                                    },
                                    options: {
                                        responsive: true,
                                        maintainAspectRatio: false,
                                        scales: {
                                            y: {
                                                beginAtZero: false,
                                                min: data.min_y,
                                                max: data.max_y,
                                                title: {
                                                    display: true,
                                                    text: 'Resultado (' + data.unit_tolerance + ')'
                                                }
                                            },
                                            x: {
                                                title: {
                                                    display: true,
                                                    text: 'Fecha y Hora'
                                                }
                                            }
                                        }, plugins: {
                                            legend: {
                                                labels: {
                                                    filter: function (legendItem, chartData) {
                                                        // Oculta del cuadro de leyenda la tolerancia negativa
                                                        return !legendItem.text.startsWith('Tolerancia (-');
                                                    }
                                                }
                                            },
                                            tooltip: {
                                                callbacks: {
                                                    label: function (context) {
                                                        let label = context.dataset.label || '';
                                                        if (label) {
                                                            label = label.split(' (')[0] + ': ';
                                                        }
                                                        if (context.parsed.y !== null) {
                                                            label += context.parsed.y + ' ' + data.unit_tolerance;
                                                        }
                                                        return label;
                                                    }
                                                }
                                            }
                                        }
                                    }
                                });
                                return false;
                            }
                            alert(data.error);
                        }
                    ).fail(function (jqXHR, textStatus, errorThrown) {
                        alert(textStatus + ': ' + errorThrown);
                    }).always(function (data) {

                    });
                }

                get_graph_data();
            }
        )
        ;
    </script>
{% endblock %}
